<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Sign up — SportyMine</title>

<style>
:root{
  --bg:#f6f8fb;
  --surface:#fff;
  --text:#15191f;
  --muted:#6b7280;
  --red:#ed1b2f;
  --red-dark:#cf1023;
  --green:#18a957;
  --line:#e2e5ea;
  --disabled-bg:#dfe2e6;
  --disabled-text:#9aa0a8;
  --shadow:0 16px 40px rgba(18,25,38,.08);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--surface);
  color:var(--text);
  line-height:1.5
}

a{
  text-decoration:none;
  color:inherit
}

button,
input{
  font:inherit
}

.top{
  height:56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:var(--red);
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  color:#fff;
  font-weight:800;
  font-size:16px;
}

.brand-mark{
  width:30px;
  height:30px;
  border-radius:9px;
  object-fit:cover;
  display:block;
}

.close-btn{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:50%;
  color:#fff;
  font-size:22px;
  font-weight:700;
}

.wrap{
  width:min(460px,100%);
  margin:0 auto;
  padding:36px 20px 40px;
}

.title{
  text-align:center;
  font-size:26px;
  font-weight:850;
  letter-spacing:-.6px;
  line-height:1.25;
  margin-bottom:8px;
}

.title span{
  color:var(--red);
}

.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  font-weight:600;
  margin-bottom:28px;
}

.field{
  margin-bottom:16px;
}

.box{
  width:100%;
  border:1.5px solid var(--line);
  border-radius:14px;
  padding:16px 16px;
  outline:none;
  background:#fff;
  font-size:16px;
  font-weight:650;
  color:var(--text);
  transition:.15s border,.15s box-shadow;
}

.box::placeholder{
  color:#9aa1a9;
  font-weight:600;
}

.box:focus{
  border-color:var(--red);
  box-shadow:0 0 0 3px rgba(237,27,47,.09);
}

.phone-box{
  display:flex;
  align-items:center;
  border:1.5px solid var(--line);
  border-radius:14px;
  padding:0 16px;
  transition:.15s border,.15s box-shadow;
}

.phone-box:focus-within{
  border-color:var(--red);
  box-shadow:0 0 0 3px rgba(237,27,47,.09);
}

.phone-code{
  color:var(--muted);
  font-weight:700;
  font-size:16px;
  padding-right:12px;
  border-right:1.5px solid var(--line);
  margin-right:12px;
}

.phone-box input{
  flex:1;
  border:0;
  outline:none;
  padding:16px 0;
  font-size:16px;
  font-weight:650;
  color:var(--text);
  min-width:0;
}

.phone-box input::placeholder{
  color:#9aa1a9;
  font-weight:600;
}

.next-btn{
  width:100%;
  height:54px;
  margin-top:6px;
  border:0;
  border-radius:14px;
  font-size:16px;
  font-weight:800;
  cursor:not-allowed;
  background:var(--disabled-bg);
  color:var(--disabled-text);
  transition:.15s ease;
}

.next-btn.ready{
  cursor:pointer;
  color:#fff;
  background:var(--red);
}

.next-btn.ready:active{
  transform:scale(.985);
}

.message{
  text-align:center;
  font-size:13px;
  font-weight:700;
  margin-top:16px;
  min-height:18px;
}

/* LOGIN LINK */

.login-link{
  text-align:center;
  margin-top:22px;
  font-size:14px;
  color:var(--muted);
  font-weight:600;
}

.login-link a{
  color:var(--red);
  font-weight:800;
}

.login-link a:active{
  color:var(--red-dark);
}
</style>
</head>

<body>

<header class="top">

  <a class="brand" href="index.html">
    <img
      src="70443.webp"
      alt="SportyMine"
      class="brand-mark"
    >
  </a>

  <a
    class="close-btn"
    href="index.html"
    aria-label="Close"
  >
    ×
  </a>

</header>


<main class="wrap">

  <h1 class="title">
    Join <span>SportyMine</span><br>
    with your details
  </h1>

  <p class="subtitle">
    Enter your name, number and password to create your account.
  </p>


  <form
    id="signupForm"
    novalidate
  >

    <div class="field">

      <input
        class="box"
        id="name"
        name="name"
        type="text"
        placeholder="Full name"
        autocomplete="name"
        required
      >

    </div>


    <div class="field">

      <div class="phone-box">

        <span class="phone-code">
          +234
        </span>

        <input
          id="phone"
          name="phone"
          type="tel"
          inputmode="numeric"
          placeholder="Mobile Number"
          autocomplete="tel"
          required
        >

      </div>

    </div>


    <div class="field">

      <input
        class="box"
        id="password"
        name="password"
        type="password"
        placeholder="Password (at least 6 characters)"
        minlength="6"
        autocomplete="new-password"
        required
      >

    </div>


    <button
      class="next-btn"
      id="nextBtn"
      type="submit"
    >
      Next
    </button>

  </form>


  <div
    class="message"
    id="message"
  ></div>


  <!-- LOGIN LINK -->

  <div class="login-link">

    Already have an account?

    <a href="login.html">
      Login
    </a>

  </div>

</main>


<script>

const USERS_KEY='sportymine_users';
const CURRENT_USER_KEY='sportymine_current_user';


const nameInput =
  document.getElementById('name');

const phoneInput =
  document.getElementById('phone');

const passwordInput =
  document.getElementById('password');

const nextBtn =
  document.getElementById('nextBtn');

const msg =
  document.getElementById('message');


function getUsers(){

  try{

    return JSON.parse(
      localStorage.getItem(USERS_KEY)
    ) || {};

  }catch(err){

    return {};

  }

}


function updateButtonState(){

  const ready =
    nameInput.value.trim() &&
    phoneInput.value.trim() &&
    passwordInput.value.length >= 6;

  nextBtn.classList.toggle(
    'ready',
    !!ready
  );

}


[
  nameInput,
  phoneInput,
  passwordInput
].forEach(el=>{

  el.addEventListener(
    'input',
    updateButtonState
  );

});


updateButtonState();


document
  .getElementById('signupForm')
  .addEventListener(
    'submit',
    function(e){

      e.preventDefault();


      const name =
        nameInput.value.trim();

      const phone =
        phoneInput.value
          .trim()
          .replace(/\s+/g,'');

      const password =
        passwordInput.value;


      if(!name || !phone || !password){

        msg.style.color='var(--red)';

        msg.textContent =
          'Please fill in all fields.';

        return;

      }


      if(password.length < 6){

        msg.style.color='var(--red)';

        msg.textContent =
          'Password must be at least 6 characters.';

        return;

      }


      const users =
        getUsers();


      if(users[phone]){

        msg.style.color='var(--red)';

        msg.textContent =
          'An account with that number already exists.';

        return;

      }


      /*
        Create the user's account.
      */

      users[phone]={

        name:name,

        phone:phone,

        password:password,

        balance:500,

        dailyEarning:0,

        activeOdd:null,

        bonusSeen:false

      };


      /*
        Save all users.
      */

      localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
      );


      /*
        Set this user as the
        currently logged-in user.
      */

      localStorage.setItem(
        CURRENT_USER_KEY,
        phone
      );


      msg.style.color='var(--green)';

      msg.textContent =
        'Welcome, '+name+
        '! Taking you to your dashboard…';


      /*
        replace() means signup won't
        remain in browser history.
      */

      setTimeout(function(){

        window.location.replace(
          'dashboard.html'
        );

      },500);

    }
  );

</script>

</body>
</html>
